  .gate p { margin: 8px 0 0; line-height: 1.55; font-size: inherit; }

function apply(lang) {
  const dict = T[lang] || T.ru;
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => {
    const val = dict[el.dataset.t];
    if (val) el.textContent = val;
  });
  document.querySelectorAll("nav button").forEach(b =>
    b.classList.toggle("on", b.dataset.lang === lang));
  try { localStorage.setItem("aijs-lang", lang); } catch (e) { /* приватный режим */ }
}

document.querySelectorAll("nav button").forEach(b =>
  b.addEventListener("click", () => apply(b.dataset.lang)));

// язык: сохранённый выбор → язык браузера → русский
let start = "ru";
try { start = localStorage.getItem("aijs-lang") || start; } catch (e) { /* ignore */ }
if (!localStorage.getItem?.("aijs-lang")) {
  const nav = (navigator.language || "ru").slice(0, 2);
  if (T[nav]) start = nav;
}
apply(start);
</script>
