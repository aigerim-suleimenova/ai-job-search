name: Build desktop apps

# Собирать приложение нужно на той же ОС, под которую оно предназначено,
# поэтому три параллельные джобы вместо кросс-компиляции.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: AI Job Search-macos
          - os: windows-latest
            artifact: AI Job Search-windows
          - os: ubuntu-latest
            artifact: AI Job Search-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pywebview на Linux рисует окно через GTK/WebKit — их нет в чистом раннере
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 libcairo2-dev libgirepository1.0-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pywebview
          # PyGObject 3.52+ требует girepository-2.0, которого нет в Ubuntu 24.04:
          # закрепляем последнюю версию, работающую с girepository-1.0.
          if [ "${{ runner.os }}" = "Linux" ]; then pip install "pygobject<3.52"; fi
        shell: bash

      - name: Build
        run: pyinstaller --clean --noconfirm packaging/aijobsearch.spec

      # Проверяем, что сборка не пустая и содержит то, без чего приложение не стартует.
      - name: Verify build
        run: python packaging/verify_build.py
        shell: bash

      - name: Package macOS disk image
        if: runner.os == 'macOS'
        run: |
          stage="$(mktemp -d)"
          cp -R "dist/AI Job Search.app" "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "AI Job Search" -srcfolder "$stage" \
            -ov -format UDZO "dist/AI Job Search.dmg"

      - name: Package Linux archive
        if: runner.os == 'Linux'
        run: tar -czf "dist/AI Job Search-linux.tar.gz" -C dist "AI Job Search"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.tar.gz
            dist/AI Job Search/
          if-no-files-found: warn

  # Собранные приложения не должны оставаться артефактами сборки: те живут
  # 90 дней и требуют входа в GitHub. По тегу складываем их в релиз.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Собрать список файлов
        run: |
          mkdir -p release
          # Только готовые к раздаче файлы. Отдельный .exe сюда не берём: сборка
          # под Windows — каталог, и запущенный без соседней папки _internal
          # загрузчик просто падает. А скачивают, конечно, именно .exe.
          find artifacts \( -name "*.dmg" -o -name "*.tar.gz" \) | while read -r f; do
            cp "$f" release/
          done
          # Windows собирается каталогом — упаковываем в zip
          win="artifacts/AI Job Search-windows"
          if [ -d "$win" ]; then
            (cd "$win" && zip -qr "$GITHUB_WORKSPACE/release/AI Job Search-windows.zip" .)
          fi
          ls -lh release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
